name: Publish

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: ./.github/actions/use-cache

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: npx nx build core --production && npx nx build w3c-utils && npx nx build markdown

      - name: Publish package on NPM
        run: npx nx release publish --access public --verbose --tag latest
        env:
          NPM_CONFIG_OIDC_TOKEN_PROVIDER: github
          NPM_CONFIG_PROVENANCE: true


      - name: Create GitHub Release
        # Only creates a GitHub release if triggered by an official version push tag
        if: github.ref_type == 'tag'
        run: gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
