# Labels applied from the branch name and the changed files (actions/labeler).
# The PR title (Conventional Commit type) is handled in
# .github/workflows/shared-labeler.yml. Label names must exist in labels.yml.

enhancement 🚀:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?(feat|feature|enhancement)[/_-]']

bug 🐞:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?(fix|bug|bugfix|hotfix)[/_-]']

release:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?release[/_-]']

refactoring:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?(refactor|refactoring)[/_-]']

performance:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?perf(ormance)?[/_-]']

testing:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?tests?[/_-]']

build:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?(chore|build)[/_-]']

dependencies:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?(deps|dependabot|renovate)[/_-]']
  - changed-files:
      - any-glob-to-any-file:
          - pnpm-lock.yaml

ci:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?ci[/_-]']
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

documentation:
  - head-branch: ['^(?:(?:ai|claude|copilot|codex)/)?docs?[/_-]']
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - '**/*.md'
